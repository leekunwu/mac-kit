<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mac Kit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #27272a;
      font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-bottom: 190px;
    }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 26px 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #e4e4e7;
    }

    .brand {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.7px;
    }

    .muted {
      font-size: 11px;
      color: #a1a1aa;
    }

    h1 {
      font-size: 25px;
      letter-spacing: -.7px;
      margin: 30px 0 7px;
    }

    .intro {
      color: #71717a;
      font-size: 13px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 0 14px;
    }

    button {
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      background: white;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      padding: 8px 12px;
      color: #52525b;
    }

    button:hover {
      background: #f4f4f5;
    }

    .category {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 18px;
      border-top: 1px solid #e4e4e7;
      padding: 18px 0;
    }

    h2 {
      font-size: 13px;
      font-weight: 650;
      margin: 15px 0;
      color: #71717a;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 3px;
      align-items: start;
    }

    .app {
      min-width: 0;
    }

    label {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 10px 4px;
      min-height: 64px;
      cursor: pointer;
      border-radius: 5px;
    }

    label:hover {
      background: #f0f0f2;
    }

    input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    label:has(input:focus-visible) {
      outline: 2px solid #818cf8;
    }

    .visual {
      width: 34px;
      height: 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .visual img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .fallback {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #71717a;
      font-weight: 600;
    }

    .fallback svg {
      width: 25px;
      height: 25px;
    }

    .tick {
      display: none;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: #27272a;
      color: white;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    input:checked + .visual img,
    input:checked + .visual .fallback {
      display: none;
    }

    input:checked + .visual .tick {
      display: flex;
    }

    .text {
      display: block;
      padding-top: 2px;
      font-size: 13px;
      font-weight: 550;
      line-height: 18px;
      min-height: 36px;
    }

    .text small {
      display: block;
      min-height: 12px;
      line-height: 12px;
      font-size: 10px;
      color: #a1a1aa;
      font-weight: 400;
      margin-top: 3px;
    }

    details {
      margin: 0 4px 7px 49px;
      font-size: 10px;
      color: #a1a1aa;
    }

    summary {
      cursor: pointer;
      list-style: none;
    }

    summary::after {
      content: '⌄';
      margin-left: 6px;
    }

    summary span {
      margin-left: 5px;
    }

    details p {
      font-size: 11px;
      color: #71717a;
      line-height: 1.5;
    }

    details a {
      display: block;
      padding: 6px 0;
      color: #52525b;
      font-size: 11px;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    details a:hover {
      text-decoration: underline;
    }

    .external {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 4px;
      color: #3f3f46;
      font-size: 13px;
      text-decoration: none;
      gap: 10px;
    }

    .external:hover {
      color: #18181b;
      text-decoration: underline;
    }

    .external span {
      color: #a1a1aa;
      font-size: 10px;
      white-space: nowrap;
    }

    .externals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 24px;
    }

    .ext-name {
      display: flex !important;
      align-items: center;
      gap: 10px;
      color: #3f3f46 !important;
      font-size: 13px !important;
    }

    .ext-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .note {
      border-top: 1px solid #e4e4e7;
      padding-top: 14px;
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.8;
    }

    .preset-status {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.7;
    }

    .preset-status button {
      padding: 4px 7px;
      margin-left: 8px;
      font-size: 10px;
    }

    .dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fffffff5;
      backdrop-filter: blur(12px);
      padding: 15px 28px;
      border-top: 1px solid #e4e4e7;
    }

    .inner {
      max-width: 1024px;
      margin: auto;
    }

    .dockrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .primary {
      background: #27272a;
      color: white;
      border-color: #27272a;
      font-weight: 600;
      padding: 10px 16px;
    }

    .primary:hover {
      background: #3f3f46;
    }

    .primary:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    pre {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      white-space: pre-wrap;
      max-height: 55px;
      overflow: auto;
      padding: 10px;
      font-size: 11px;
      color: #52525b;
      margin: 10px 0 7px;
    }

    .help {
      font-size: 11px;
      color: #a1a1aa;
    }

    .help a {
      color: #71717a;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 180px;
      transform: translateX(-50%);
      background: #27272a;
      color: white;
      padding: 11px 17px;
      border-radius: 7px;
      font-size: 12px;
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 800px) {
      .category {
        grid-template-columns: 85px 1fr;
        gap: 10px;
      }

      .items {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 10px;
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 22px 16px;
      }

      .category {
        grid-template-columns: 60px 1fr;
        gap: 8px;
      }

      h2 {
        font-size: 11px;
      }

      .items {
        gap: 3px 5px;
      }

      .text {
        font-size: 11px;
      }

      label {
        gap: 5px;
        padding: 10px 0;
      }

      .visual {
        width: 28px;
        height: 30px;
      }

      .visual img {
        width: 25px;
        height: 25px;
      }

      details {
        margin-left: 33px;
        font-size: 9px;
      }

      .text small {
        font-size: 9px;
      }

      .externals {
        grid-template-columns: 1fr;
      }

      .dock {
        padding: 14px 16px;
      }

      .toolbar {
        font-size: 11px;
      }

      .tick {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <span class="brand">Mac Kit</span>
      <span class="muted">Personal setup</span>
    </header>

    <h1>앱 설치</h1>
    <p class="intro">선택 → 명령 복사 → 터미널 실행</p>

    <div class="toolbar">
      <span class="muted" id="app-total">Homebrew · 17개</span>

      <div>
        <button id="all" type="button">전체 선택</button>
        <button id="none" type="button">선택 해제</button>
      </div>
    </div>

    <div id="app-categories"></div>

    <p class="preset-status" id="preset-status">프리셋 확인 중</p>
    <p class="note">라이선스·API 키는 업로드하지 마세요.</p>

    <noscript>
      <p class="note">
        앱 목록과 설치 명령을 표시하려면 JavaScript를 활성화하세요.
      </p>
    </noscript>
  </main>

  <footer class="dock">
    <div class="inner">
      <div class="dockrow">
        <strong id="count">선택한 앱 없음</strong>

        <button class="primary" id="copy" type="button" disabled>
          명령 복사
        </button>
      </div>

      <pre id="cmd">앱을 선택하세요.</pre>

      <div class="help">
        Homebrew 필요 ·
        <a
          href="https://brew.sh/"
          rel="noopener noreferrer"
          target="_blank"
        >설치 안내 ↗</a>
        · 터미널 자동 실행 없음
      </div>
    </div>
  </footer>

  <div id="toast" role="status"></div>

  <script src="./app.js"></script>

  <script>
    (() => {
      "use strict";

      const settings = window.MAC_KIT;

      if (!settings || !Array.isArray(settings.groups)) {
        console.error("app.js를 불러오지 못했거나 설정이 올바르지 않습니다.");
        return;
      }

      const { github: githubSettings = {}, groups } = settings;

      const elements = {
        categories: document.getElementById("app-categories"),
        appTotal: document.getElementById("app-total"),
        selectAll: document.getElementById("all"),
        deselectAll: document.getElementById("none"),
        count: document.getElementById("count"),
        copy: document.getElementById("copy"),
        command: document.getElementById("cmd"),
        presetStatus: document.getElementById("preset-status"),
        toast: document.getElementById("toast")
      };

      const checkboxInputs = [];
      const presetSlots = [];

      let presetsLoading = false;
      let toastTimer;

      const FALLBACK_ICON = `
        <svg
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          viewBox="0 0 24 24"
        >
          <rect height="18" rx="3" width="16" x="4" y="3"></rect>
          <path d="M8 8h8M8 12h8M8 16h5"></path>
        </svg>
      `;

      function createElement(tag, className, text) {
        const element = document.createElement(tag);

        if (className) {
          element.className = className;
        }

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      }

      function createExternalLink(url, className) {
        const link = createElement("a", className);
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        return link;
      }

      function createPresetSlot(preset, name) {
        const details = document.createElement("details");
        details.dataset.presets = preset;

        const summary = document.createElement("summary");
        summary.setAttribute("aria-label", name + " 프리셋");
        summary.append(document.createTextNode("프리셋 "));

        const count = createElement("span", "", "0");
        summary.append(count);

        const content = document.createDocumentFragment();
        content.append(createElement("p", "", "등록된 파일 없음"));

        details.append(summary, content);

        presetSlots.push({
          element: details,
          count,
          preset
        });

        return details;
      }

      function createAppVisual(app) {
        const visual = createElement("span", "visual");

        const image = document.createElement("img");
        image.alt = "";
        image.dataset.logo = "";
        image.referrerPolicy = "no-referrer";

        const fallback = createElement("span", "fallback");
        fallback.hidden = true;
        fallback.innerHTML = FALLBACK_ICON;

        const tick = createElement("span", "tick", "✓");
        tick.setAttribute("aria-hidden", "true");

        function showFallback() {
          image.hidden = true;
          fallback.hidden = false;
        }

        image.addEventListener("error", showFallback, { once: true });

        if (app.icon) {
          image.src = app.icon;

          if (image.complete && !image.naturalWidth) {
            showFallback();
          }
        } else {
          showFallback();
        }

        visual.append(image, fallback, tick);

        return visual;
      }

      function createBrewApp(app) {
        const wrapper = createElement("div", "app");
        const label = document.createElement("label");

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = app.cask;
        checkboxInputs.push(input);

        const text = createElement("span", "text");
        text.append(document.createTextNode(app.name));
        text.append(createElement("small", "", app.note || ""));

        label.append(input, createAppVisual(app), text);

        wrapper.append(
          label,
          createPresetSlot(app.preset, app.name)
        );

        return wrapper;
      }

      function createLinkApp(app) {
        const wrapper = document.createElement("div");
        const link = createExternalLink(app.url, "external");

        if (app.icon) {
          const name = createElement("span", "ext-name");
          const image = createElement("img", "ext-icon");

          image.alt = "";
          image.width = 26;
          image.height = 26;

          image.addEventListener("error", () => {
            image.hidden = true;
          }, { once: true });

          image.src = app.icon;

          name.append(image, document.createTextNode(app.name));
          link.append(name);
        } else {
          link.append(document.createTextNode(app.name));
        }

        link.append(createElement("span", "", app.linkLabel));

        wrapper.append(
          link,
          createPresetSlot(app.preset, app.name)
        );

        return wrapper;
      }

      function renderGroups() {
        const fragment = document.createDocumentFragment();

        groups.forEach(group => {
          const section = createElement("section", "category");
          const heading = createElement("h2", "", group.category);
          const items = document.createElement("div");

          if (group.type === "brew") {
            items.className = "items";

            group.items.forEach(app => {
              items.append(createBrewApp(app));
            });
          } else {
            if (group.layout === "grid") {
              items.className = "externals";

              group.items.forEach(app => {
                items.append(createLinkApp(app));
              });
            } else {
              group.items.forEach(app => {
                const wrapper = createLinkApp(app);

                // 기존 단일 다운로드 영역의 DOM 구조를 유지합니다.
                items.append(...wrapper.childNodes);
              });
            }
          }

          section.append(heading, items);
          fragment.append(section);
        });

        elements.categories.replaceChildren(fragment);

        elements.appTotal.textContent =
          "Homebrew · " + checkboxInputs.length + "개";
      }

      function getSelectedCasks() {
        return checkboxInputs
          .filter(input => input.checked)
          .map(input => input.value);
      }

      function buildCommand(casks = getSelectedCasks()) {
        return "brew update && brew install --cask " + casks.join(" ");
      }

      function updateSelection() {
        const selectedCasks = getSelectedCasks();
        const count = selectedCasks.length;

        elements.count.textContent =
          count ? count + "개 선택" : "선택한 앱 없음";

        elements.copy.disabled = count === 0;

        elements.command.textContent =
          count ? buildCommand(selectedCasks) : "앱을 선택하세요.";
      }

      function setAllSelected(checked) {
        checkboxInputs.forEach(input => {
          input.checked = checked;
        });

        updateSelection();
      }

      function showToast(message) {
        clearTimeout(toastTimer);

        elements.toast.textContent = message;
        elements.toast.style.display = "block";

        toastTimer = setTimeout(() => {
          elements.toast.style.display = "none";
        }, 2000);
      }

      async function copyCommand() {
        const selectedCasks = getSelectedCasks();

        if (!selectedCasks.length) {
          return;
        }

        const command = buildCommand(selectedCasks);

        try {
          await navigator.clipboard.writeText(command);
          showToast("복사됨");
        } catch {
          window.prompt("명령 복사", command);
        }
      }

      function resolveGitHubConfig() {
        let owner = githubSettings.owner || "";
        let repo = githubSettings.repo || "";

        const host = location.hostname;

        if (host.endsWith(".github.io")) {
          owner = owner || host.slice(0, -10);

          repo = repo || decodeURIComponent(
            location.pathname.split("/").filter(Boolean)[0] || host
          );
        }

        return {
          owner,
          repo,
          branch: githubSettings.branch || "main"
        };
      }

      function clearPresetSlot(slot, message) {
        const summary = slot.element.querySelector("summary");

        slot.count.textContent = "0";
        slot.element.replaceChildren(summary);

        if (message) {
          slot.element.append(createElement("p", "", message));
        }
      }

      function setAllPresetMessages(message) {
        presetSlots.forEach(slot => {
          clearPresetSlot(slot, message);
        });
      }

      function buildTreeUrl(github) {
        return (
          "https://api.github.com/repos/" +
          encodeURIComponent(github.owner) +
          "/" +
          encodeURIComponent(github.repo) +
          "/git/trees/" +
          encodeURIComponent(github.branch) +
          "?recursive=1"
        );
      }

      function buildRawFileBaseUrl(github) {
        return (
          "https://raw.githubusercontent.com/" +
          encodeURIComponent(github.owner) +
          "/" +
          encodeURIComponent(github.repo) +
          "/" +
          encodeURIComponent(github.branch) +
          "/"
        );
      }

      function getResponseError(status) {
        if (status === 403 || status === 429) {
          return "조회 한도 초과 · 잠시 후 다시 시도";
        }

        if (status === 404) {
          return "저장소·공개 여부·브랜치를 확인하세요";
        }

        return "프리셋 조회 실패";
      }

      async function fetchPresetTree(github) {
        const response = await fetch(buildTreeUrl(github), {
          headers: {
            Accept: "application/vnd.github+json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(getResponseError(response.status));
        }

        const data = await response.json();

        if (data.truncated) {
          throw new Error("파일 목록이 너무 큽니다");
        }

        if (!Array.isArray(data.tree)) {
          throw new Error("잘못된 파일 목록");
        }

        return data.tree;
      }

      function indexPresetFiles(tree) {
        const fileMap = new Map(
          presetSlots.map(slot => [slot.preset, []])
        );

        tree.forEach(file => {
          if (
            file.type !== "blob" ||
            typeof file.path !== "string" ||
            !file.path.startsWith("presets/")
          ) {
            return;
          }

          const relativePath = file.path.slice("presets/".length);
          const separator = relativePath.indexOf("/");

          if (separator === -1) {
            return;
          }

          const preset = relativePath.slice(0, separator);
          const files = fileMap.get(preset);

          if (!files) {
            return;
          }

          const filePath = relativePath.slice(separator + 1);

          if (
            !filePath ||
            filePath.split("/").some(part => part.startsWith("."))
          ) {
            return;
          }

          files.push({
            path: file.path,
            name: filePath
          });
        });

        fileMap.forEach(files => {
          files.sort((a, b) => a.path.localeCompare(b.path));
        });

        return fileMap;
      }

      function renderPresetFiles(fileMap, github) {
        const baseUrl = buildRawFileBaseUrl(github);
        let total = 0;

        presetSlots.forEach(slot => {
          const files = fileMap.get(slot.preset) || [];

          clearPresetSlot(
            slot,
            files.length ? "" : "등록된 파일 없음"
          );

          const fragment = document.createDocumentFragment();

          files.forEach(file => {
            const encodedPath = file.path
              .split("/")
              .map(encodeURIComponent)
              .join("/");

            const link = createExternalLink(baseUrl + encodedPath);

            link.textContent = file.name;
            link.download = file.path.split("/").pop();
            link.title = "파일 열기 · 다운로드";

            fragment.append(link);
          });

          slot.element.append(fragment);
          slot.count.textContent = String(files.length);

          total += files.length;
        });

        return total;
      }

      function appendPresetRefreshButton() {
        const button = createElement("button", "", "새로고침");
        button.type = "button";
        button.addEventListener("click", loadPresets);

        elements.presetStatus.append(button);
      }

      async function loadPresets() {
        if (presetsLoading) {
          return;
        }

        setAllPresetMessages("확인 중");

        const github = resolveGitHubConfig();

        if (!github.owner || !github.repo) {
          setAllPresetMessages("GitHub Pages에서 확인");

          elements.presetStatus.textContent =
            "표준 GitHub Pages에서 자동 연결 · 로컬/커스텀 도메인은 GITHUB 설정 필요";

          return;
        }

        presetsLoading = true;
        elements.presetStatus.textContent = "프리셋 확인 중";

        try {
          const tree = await fetchPresetTree(github);
          const fileMap = indexPresetFiles(tree);
          const total = renderPresetFiles(fileMap, github);

          elements.presetStatus.textContent = "프리셋 " + total + "개";
        } catch (error) {
          setAllPresetMessages("목록을 불러오지 못했습니다");

          elements.presetStatus.textContent =
            error instanceof Error
              ? error.message
              : "프리셋 조회 실패";
        } finally {
          presetsLoading = false;
          appendPresetRefreshButton();
        }
      }

      function bindEvents() {
        elements.categories.addEventListener("change", event => {
          if (event.target.matches('input[type="checkbox"]')) {
            updateSelection();
          }
        });

        elements.selectAll.addEventListener("click", () => {
          setAllSelected(true);
        });

        elements.deselectAll.addEventListener("click", () => {
          setAllSelected(false);
        });

        elements.copy.addEventListener("click", copyCommand);
      }

      renderGroups();
      bindEvents();
      updateSelection();
      loadPresets();
    })();
  </script>
</body>
</html>
